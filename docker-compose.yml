# DB-AIOps v2.5 production-like single-host topology.
# Secrets are mandatory environment variables; do not place them in this file.

name: dbmonitor

x-app-environment: &app-environment
  DJANGO_ENV: production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  DB_MONITOR_SECRET_KEY: ${DB_MONITOR_SECRET_KEY:?DB_MONITOR_SECRET_KEY is required}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS is required}
  USE_POSTGRESQL: "True"
  POSTGRES_HOST: timescaledb
  POSTGRES_PORT: "5432"
  POSTGRES_DB: db_monitor
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  TIMESCALEDB_ENABLED: "True"
  TIMESCALEDB_HOST: timescaledb
  TIMESCALEDB_PORT: "5432"
  TIMESCALEDB_NAME: db_monitor
  TIMESCALEDB_USER: postgres
  TIMESCALEDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  USE_REDIS_CACHE: "True"
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  ES_ENABLED: "True"
  ES_URL: http://elastic:${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}@elasticsearch:9200
  DJANGO_TRUSTED_PROXY_IPS: ${DBMONITOR_BACKEND_SUBNET:-172.30.25.0/24}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-oapi.dingtalk.com,qyapi.weixin.qq.com}
  CONTENT_SECURITY_POLICY: ${CONTENT_SECURITY_POLICY:-}
  LLM_ALLOWED_ENDPOINT_HOSTS: ${LLM_ALLOWED_ENDPOINT_HOSTS:-}
  LLM_PROXY_URL: ${LLM_PROXY_URL:-}
  ENABLE_RATE_LIMIT: "True"
  READINESS_REQUIRE_WORKERS: "True"

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: dbmonitor/backend:2.5.0
  environment: *app-environment
  init: true
  restart: unless-stopped
  depends_on:
    timescaledb:
      condition: service_healthy
    redis:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
  networks: [backend]
  security_opt:
    - no-new-privileges:true

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
    environment:
      POSTGRES_DB: db_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose: ["5432"]
    volumes:
      - timeseries_data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_monitor"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    expose: ["6379"]
    volumes:
      - redis_data:/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3@sha256:bbac63ecd50e9263565fbb616172a5287d5f99e486d76453e81e32cafcba3838
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      cluster.name: dbmonitor-es
    expose: ["9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    security_opt:
      - no-new-privileges:true

  web:
    <<: *app-service
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py init_timeseries &&
        python manage.py init_playbooks &&
        exec gunicorn --bind 0.0.0.0:8000 --workers 3 --worker-class gthread
        --threads 8 --worker-tmp-dir /dev/shm --timeout 120
        --access-logfile - --error-logfile - dbmonitor.wsgi:application
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/livez"]
      interval: 15s
      timeout: 5s
      retries: 10

  collector:
    <<: *app-service
    command: ["python", "manage.py", "start_monitor"]
    depends_on:
      web:
        condition: service_healthy

  sentinel:
    <<: *app-service
    command: ["python", "manage.py", "start_sentinel"]
    depends_on:
      web:
        condition: service_healthy

  pipeline:
    <<: *app-service
    command: ["python", "manage.py", "start_pipeline"]
    depends_on:
      web:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: dbmonitor/frontend:2.5.0
    ports:
      # 默认只供宿主机上的 TLS 入口代理访问；不要把明文 HTTP 直接暴露到生产网。
      - "${DBMONITOR_BIND_ADDRESS:-127.0.0.1}:${DBMONITOR_HTTP_PORT:-3000}:8080"
    depends_on:
      web:
        condition: service_healthy
    networks:
      frontend:
      backend:
        ipv4_address: ${DBMONITOR_FRONTEND_BACKEND_IP:-172.30.25.10}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  timeseries_data:
  redis_data:
  es_data:

networks:
  frontend:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${DBMONITOR_BACKEND_SUBNET:-172.30.25.0/24}
