name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  # 同一 PR 的新推送取消旧运行，省 Actions 额度
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret
  DB_MONITOR_SECRET_KEY: ci-only-not-a-real-secret
  TIMESCALEDB_ENABLED: 'False'
  ES_ENABLED: 'False'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  # ── 静态检查：秒级，最先失败 ───────────────────────────────
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: 语法编译
        run: python -m compileall -q monitor dbmonitor
      - name: Django 系统检查
        run: python manage.py check
      - name: 迁移漂移检查
        # 模型改了却没生成 migration → 本地能跑、部署即炸
        run: python manage.py makemigrations --check --dry-run
      - name: 依赖完整性
        # 防 BUG-137 复现：requirements 里声明了但装不上/装漏
        run: python scripts/check_deps.py

  # ── 单元测试：无外部服务，最快反馈 ──────────────────────────
  test-unit:
    name: 单元测试（无外部依赖）
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: 运行 unit 层
        env:
          DJANGO_SETTINGS_MODULE: dbmonitor.settings_test_unit
        run: python manage.py test monitor --tag unit -v 2

  # ── 集成测试：真 PostgreSQL，跑全量 ────────────────────────
  test-integration:
    name: 集成测试（PostgreSQL）
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db_monitor
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: 全量测试
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python manage.py test monitor -v 1
      - name: 随机顺序复跑（查测试间耦合）
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python manage.py test monitor --shuffle -v 1

  # ── 方言测试：真实 MySQL/PG，覆盖 checkers ──────────────────
  test-dialect:
    name: 方言测试（MySQL/PG）
    runs-on: ubuntu-latest
    needs: static
    # Oracle 容器体积大启动慢，仅在 master 推送与打了标签的 PR 上跑
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-dialect')
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: db_monitor }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-retries 5
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root123, MYSQL_DATABASE: testdb }
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval 10s --health-retries 10
      target-pg:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: targetdb }
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: 方言集成测试
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DIALECT_MYSQL_DSN: mysql://root:root123@127.0.0.1:3306/testdb
          DIALECT_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5433/targetdb
          # service_name 走 DSN 的 path 段（_cfg_from_dsn 如此解析）
        # 把测试输出同时写进 job summary：service container 的日志会把
        # job log 的尾部占满，导致 API 取不到 Python 侧的 traceback，
        # 失败时无从诊断（本轮就因此盲调了两轮）。
        run: |
          set -o pipefail
          python manage.py test monitor.tests_dialect -v 2 2>&1 | tee /tmp/dialect.log
      - name: 失败输出写入 job summary
        if: failure()
        run: |
          echo '## 方言测试失败输出' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -120 /tmp/dialect.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Oracle 方言：独立 job 且不阻断 ─────────────────────────
  # 为什么单拆并且 continue-on-error：
  #   ① 镜像 ~2GB、启动 2-3 分钟，混在主 dialect job 里会拖慢所有方言反馈；
  #   ② 该 job 目前**尚未有人在可复现的环境里验证通过** —— 开发容器起不了
  #      Oracle，只能靠 CI 盲调。在有人真正跑通之前，把它当作"信息性信号"
  #      而不是门禁，比让 master 长期挂一个没人能诊断的红叉更诚实。
  # 跑通后请去掉 continue-on-error，并把它加入必需检查。
  test-dialect-oracle:
    name: 方言测试（Oracle，信息性）
    runs-on: ubuntu-latest
    needs: static
    continue-on-error: true
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-dialect')
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: db_monitor }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-retries 5
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env: { ORACLE_PASSWORD: oracle123 }
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s --health-timeout 10s --health-retries 30
    env:
      # 监控要读 v$session / v$sqlstats / dba_objects，必须用有数据字典权限的账号；
      # 生产环境对应做法是给监控账号授 SELECT_CATALOG_ROLE。
      DIALECT_ORACLE_DSN: oracle://system:oracle123@127.0.0.1:1521/FREEPDB1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      # ── 两个探针：把"为什么 skip"编码进 step 的红绿 ────────────────
      # 上一轮已经确认 OracleDialectTests 是**全部 skip** 的（断言步骤挂了）。
      # 但 skip 有两种原因（连不上 / 连上了但读不到数据字典），二者在
      # jobs API 里长得一样，而具体原因只写在 job log 里 —— 而 Oracle 容器
      # 的启动日志会在 teardown 时把 log 尾部占满，按 tail 拉根本翻不到，
      # artifact 又受出网策略限制未必下得到。
      # 所以把这两个判断各自做成一个 step：step 的 conclusion 是 jobs API
      # 直接可读的，等于给"为什么没验证成"开了一条不会被淹掉的窄带信道。
      # continue-on-error 让探针失败不影响后面的步骤继续跑。
      - name: 探针①：能否连上 Oracle
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, oracledb
          from urllib.parse import urlparse
          u = urlparse(os.environ['DIALECT_ORACLE_DSN'])
          oracledb.connect(user=u.username, password=u.password,
                           dsn=f"{u.hostname}:{u.port}/{(u.path or '/').lstrip('/')}").close()
          print('连接成功')
          PY
      - name: 探针②：能否读 v$session
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, oracledb
          from urllib.parse import urlparse
          u = urlparse(os.environ['DIALECT_ORACLE_DSN'])
          c = oracledb.connect(user=u.username, password=u.password,
                               dsn=f"{u.hostname}:{u.port}/{(u.path or '/').lstrip('/')}")
          cur = c.cursor()
          cur.execute("SELECT COUNT(*) FROM v$session WHERE ROWNUM = 1")
          print('v$session 可读：', cur.fetchone())
          c.close()
          PY
      - name: Oracle 方言测试
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          set -o pipefail
          python manage.py test monitor.tests_dialect.OracleDialectTests -v 2 \
            2>&1 | tee /tmp/oracle.log
      # 这个 job 无论成败都把输出写进 summary（不像主 dialect job 只在失败时写）：
      # 它现在是"信息性"的，绿灯本身不说明问题 —— 用例可能是**全部 skip 了**
      # （连不上/没权限时 _require_catalog_access 会跳过）。要判断能否摘掉
      # continue-on-error、把它升级成门禁，必须先看到 "Ran N tests ... skipped=?"。
      - name: 输出写入 job summary
        if: always()
        run: |
          echo '## Oracle 方言测试输出' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 /tmp/oracle.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo '(无输出)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      # 把"用例到底跑没跑"变成这个 job 自己的红绿，而不是要人去翻日志。
      # 动机：informational job 绿灯有两种含义 —— ①用例真跑通了；②用例全 skip
      # 了（连不上/没数据字典权限时 _require_catalog_access 会跳过）。这两种在
      # jobs API 里长得一模一样，而 Oracle 容器日志会淹掉 job log、artifact 又
      # 未必下得到。索性显式断言："跑了 ≥1 条 且 一条都没 skip"。
      # 因为整个 job 是 continue-on-error，这里红了不阻断合并，只是把
      # "还没真正验证过" 这个事实明确地摆在 CI 面板上 —— 绿灯造成的虚假安心，
      # 正是 W1 建 CI 时要避免的东西。
      # 断言"用例真的跑了"，但要分清 skip 的两种性质：
      #   ① 环境级 skip（连不上 / 读不到数据字典）—— 等于根本没验证，必须报错；
      #   ② 数据级 skip（采样窗口里没抓到目标会话）—— 用例自身设计问题，
      #      现已改成造负载+重试后判失败，不该再出现，出现了同样要报错。
      # 上一版把两者混为一谈（只看 skipped=N），导致我把"1 条数据级 skip"
      # 误读成"用例全 skip、绿灯含金量为零"。断言下得太粗，会制造假情报。
      - name: 确认用例真的跑了（不是全 skip）
        if: always()
        run: |
          if [ ! -s /tmp/oracle.log ]; then
            echo "::error::Oracle 方言测试没有任何输出"; exit 1
          fi
          if ! grep -qE '^Ran [1-9][0-9]* test' /tmp/oracle.log; then
            echo "::error::Oracle 方言用例一条都没执行"; exit 1
          fi
          if grep -qE '无法连接 Oracle|读不到 v\$session' /tmp/oracle.log; then
            echo "::error::环境级 skip：连不上库或没有数据字典权限，方言根本没验证"
            grep -nE '无法连接 Oracle|读不到 v\$session' /tmp/oracle.log | head -5
            exit 1
          fi
          if grep -qE 'skipped=[1-9]' /tmp/oracle.log; then
            echo "::error::仍有 skip 的用例（非环境原因），下面是 skip 明细"
            grep -nE 'skipped|skip ' /tmp/oracle.log | head -10
            exit 1
          fi
          echo "Oracle 方言用例全部实跑通过，可以考虑摘掉 continue-on-error"
      # 再传一份 artifact：Oracle 容器启动日志有几百行，teardown 时会灌进 job log，
      # 从 API 按 tail 取日志根本翻不到 Python 那几行。artifact 可以直接下载。
      - name: 上传原始输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-dialect-log
          path: /tmp/oracle.log
          if-no-files-found: warn
          retention-days: 7

  # ── 前端 ───────────────────────────────────────────────
  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: 组件测试（存在时）
        working-directory: frontend
        run: npm test --if-present -- --run

  # ── 安全 ───────────────────────────────────────────────
  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 依赖已知漏洞
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
        # 注：首次接入设为不阻断（|| true），积累基线后改为强制
      - name: 密钥扫描
        run: python scripts/scan_secrets.py
